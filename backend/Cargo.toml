[workspace]

members = ["model", "server", "proto", "utils"]

[package]
name = "tstats_backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tstats_backend"
path = "src/main.rs"

[workspace.dependencies]

chrono = { version = "0.4" }
miette = { version = "7.1.0" }
poem = { version = "3.1", features = [ "redis-session", "server", "tokio-stream"]}
poem-openapi = { version = "5.1", features = [ "swagger-ui", "chrono" ] }
tokio = { version = "1.41", features = ["macros"] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

tracing-subscriber = { version = "0.3" }
server = { path = "server" }
miette.workspace = true
tokio.workspace = true
tracing-error = "0.2.0"
