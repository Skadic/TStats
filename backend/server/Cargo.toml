[package]
name = "server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

model = { path = "../model" }
proto = { path = "../proto" }
utils = { path = "../utils" }

chrono.workspace = true
deadpool-redis = { version = "0.16", features = ["rt_tokio_1"] }
# Read .env files
dotenvy = "0.15"
# Utilities for working with futures
futures = "0.3"
# HTTP utilities
http = "1.1"
# Iterator utilities
itertools = "0.13"
# Convenient error handling
miette = { version = "7.1", features = ["fancy"] }
# Authentication using OAuth2
oauth2 = "4.4"
poem.workspace = true
poem-openapi.workspace = true
rand = "0.8"
# Redis client
redis = { version = "0.26", features = ["tokio-comp", "serde_json", "json"] }
# Osu API connector
rosu-v2 = { version = "0.9", features = ["serialize"] }
# SQL ORM
sea-orm = { version = "1", features = ["runtime-tokio-rustls"] }
# Serialization/Deserialization
serde = "1.0"
serde_json = "1.0"
sqlx = { version = "0.7", features = [
    "macros",
    "postgres",
    "runtime-tokio-rustls",
] }
# Creating error types conveniently
thiserror = "1.0"
# Async runtime
tokio = { version = "1.34", features = ["rt-multi-thread", "macros", "signal"] }
# HTTP-middleware
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
# Instrumentation and logging
tracing = "0.1"
# URL-related utilities
url = "2.5"
urlencoding = "2.1"
rand_chacha = "0.3.1"
reqwest = "0.12"
scrypt = "0.11.0"
base64 = "0.22.0"
aes-gcm = { version = "0.10.3", features = ["std"] }
tracing-error = "0.2.0"

[dev-dependencies]
ctor = "0.2.7"
